name: Build APK
on:
  push:
  workflow_dispatch:
jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: 17
      - name: Aceptar licencias del SDK
        run: yes | "$ANDROID_HOME/cmdline-tools/latest/bin/sdkmanager" --licenses > /dev/null || true
      - name: Build
        run: chmod +x gradlew && ./gradlew assembleRelease --no-daemon
      - name: Renombrar APK
        run: |
          mkdir -p out
          cp app/build/outputs/apk/release/app-release.apk "out/@ʜɪᴅᴅᴇɴ ᴀʀᴛ 🎨.apk"
      - uses: actions/upload-artifact@v4
        with:
          name: VoidPanel-apk
          path: out/
